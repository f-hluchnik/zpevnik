name: Build songbook and publish to website
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    # Pinned runner image (D-105): Ubuntu 24.04 ships TeX Live 2023 (pdfTeX
    # 1.40.25). Do not use ubuntu-latest: a newer image has a newer TeX Live and
    # changes the layout; move on purpose and review the song-by-song diff (S3).
    runs-on: ubuntu-24.04
    env:
      LATEXMK: latexmk -pdf -file-line-error -interaction=nonstopmode -halt-on-error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derived .tex files are build outputs, not committed (D-104).
      - name: Generate derived files
        run: python3 tools/generate.py

      # Song order (D-107): unit tests of the Czech collation (R9).
      - name: Unit tests
        run: python3 -m unittest discover -s tools

      # TeX Live from the runner's apt (a container would take two minutes to
      # download). texlive-fonts-extra is big but needed for one cursive font;
      # poppler is for the PDF diff. Verified identical to the container build.
      - name: Install TeX Live and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-fonts-extra \
            texlive-lang-czechslovak cm-super latexmk poppler-utils
          pdflatex --version | head -1

      - name: Compile LaTeX
        run: $LATEXMK zpevnik.tex

      - name: Check one song per page
        run: python3 tools/check_pages.py

      - name: Prepare single-song test
        run: bash tests/single-song.sh tests/build

      # Overleaf setup (D-005), edge cases of \artist (D-003) and the metadata
      # macros (R8): tests/single-song.sh --build checks what each prints, CI
      # checks that they compile.
      - name: Compile single-song, artist and metadata tests
        working-directory: tests/build
        run: |
          for test in single-song artist metadata; do
            $LATEXMK "$test.tex"
          done

      # Pull requests only: build the base (the first parent of the merge
      # commit) in the same job with the same TeX Live and report which songs
      # differ (D-106). The report never fails the build.
      - name: Check out base for the PDF diff
        if: github.event_name == 'pull_request'
        run: |
          base=HEAD^1
          git rev-parse --verify -q HEAD^2 >/dev/null || base="${{ github.event.pull_request.base.sha }}"
          git worktree add base "$base"

      # The base only has a generator once an earlier ticket has added one.
      - name: Generate derived files for base
        if: github.event_name == 'pull_request'
        run: if [ -f base/tools/generate.py ]; then python3 base/tools/generate.py base; fi

      - name: Compile base
        if: github.event_name == 'pull_request'
        working-directory: base
        run: $LATEXMK zpevnik.tex

      - name: Song-by-song PDF diff
        if: github.event_name == 'pull_request'
        run: python3 tools/pdfdiff.py --base base --head . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 tools/generate.py --version)

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]; then
            echo "::error::Computed version '$version' looks invalid, aborting."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: List newly added songs
        id: new_songs
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            added=""
          else
            added=$(git diff --name-status "$base" "${{ github.sha }}" -- pisnicky/ \
                    | awk '$1=="A" {print $2}')
          fi

          {
            echo "block<<SONGSEOF"
            if [ -n "$added" ]; then
              echo ""
              printf '%s\n' "$added" | while IFS= read -r f; do
                [ -z "$f" ] && continue
                title=$(grep -oP '(?<=\\song\{)[^}]*' "$f" | head -n1)
                echo "- ${title:-$(basename "$f" .tex)}"
              done
            fi
            echo "SONGSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout website repo
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: f-hluchnik/zpevnik-web
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Write version file
        if: github.event_name == 'push'
        run: echo "${{ steps.version.outputs.version }}" > website/version.txt

      - name: Update PDF
        if: github.event_name == 'push'
        run: cp zpevnik.pdf website/static/files/zpevnik_last.pdf

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v${{ steps.version.outputs.version }}
            name: Zpěvník v${{ steps.version.outputs.version }}
            body: |
                ${{ steps.new_songs.outputs.block }}
                
            files: zpevnik.pdf
            make_latest: true

      - name: Commit and push
        if: github.event_name == 'push'
        working-directory: website
        run: |
          git config user.name "songbook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add version.txt static/files/zpevnik_last.pdf
          git commit -m "Update songbook to v${{ steps.version.outputs.version }}" || echo "nothing to commit"
          git push