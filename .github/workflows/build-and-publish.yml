name: Build songbook and publish to website
on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: zpevnik.tex

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          count=$(ls pisnicky/*.tex | wc -l)
          n=$((count + 100))
          version=$(printf '%d.%02d' $((n / 100)) $((n % 100)))

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]; then
            echo "::error::Computed version '$version' looks invalid, aborting."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: f-hluchnik/zpevnik-web
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Render index.md from template
        working-directory: website
        run: |
          set -euo pipefail
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/g" \
            content/pages/index.md.tpl > content/pages/index.md

      - name: Update PDF
        run: cp zpevnik.pdf website/static/files/zpevnik_last.pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v${{ steps.version.outputs.version }}
            name: Zpěvník v${{ steps.version.outputs.version }}
            body: |
                Zpěvník verze ${{ steps.version.outputs.version }}
                
                Počet písniček: ${{ steps.version.outputs.count }}
            files: zpevnik.pdf
            make_latest: true

      - name: Commit and push
        working-directory: website
        run: |
          git config user.name "songbook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/pages/index.md static/files/zpevnik_last.pdf
          git commit -m "Update songbook to v${{ steps.version.outputs.version }}" || echo "nothing to commit"
          git push