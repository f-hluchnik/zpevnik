name: Build songbook and publish to website
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: zpevnik.tex
          # Pinned to the image that built the published v8.33 (TeX Live 2026,
          # pdfTeX 1.40.29). `texlive_version` cannot express this: v3 knows
          # only 2020-2025, and "2025"/"latest" both mean the moving :latest.
          # Bump deliberately (and expect layout differences) when updating.
          docker_image: ghcr.io/xu-cheng/texlive-full@sha256:11383430b9a3e48c0b79339f34d8092f942f897d91ab3749d4899d06731fea7f

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          count=$(ls pisnicky/*.tex | wc -l)
          n=$((count + 100))
          version=$(printf '%d.%02d' $((n / 100)) $((n % 100)))

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]; then
            echo "::error::Computed version '$version' looks invalid, aborting."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: List newly added songs
        id: new_songs
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            added=""
          else
            added=$(git diff --name-status "$base" "${{ github.sha }}" -- pisnicky/ \
                    | awk '$1=="A" {print $2}')
          fi

          {
            echo "block<<SONGSEOF"
            if [ -n "$added" ]; then
              echo ""
              printf '%s\n' "$added" | while IFS= read -r f; do
                [ -z "$f" ] && continue
                title=$(grep -oP '(?<=\\song\{)[^}]*' "$f" | head -n1)
                echo "- ${title:-$(basename "$f" .tex)}"
              done
            fi
            echo "SONGSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout website repo
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: f-hluchnik/zpevnik-web
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Write version file
        if: github.event_name == 'push'
        run: echo "${{ steps.version.outputs.version }}" > website/version.txt

      - name: Update PDF
        if: github.event_name == 'push'
        run: cp zpevnik.pdf website/static/files/zpevnik_last.pdf

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v${{ steps.version.outputs.version }}
            name: Zpěvník v${{ steps.version.outputs.version }}
            body: |
                ${{ steps.new_songs.outputs.block }}
                
            files: zpevnik.pdf
            make_latest: true

      - name: Commit and push
        if: github.event_name == 'push'
        working-directory: website
        run: |
          git config user.name "songbook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add version.txt static/files/zpevnik_last.pdf
          git commit -m "Update songbook to v${{ steps.version.outputs.version }}" || echo "nothing to commit"
          git push