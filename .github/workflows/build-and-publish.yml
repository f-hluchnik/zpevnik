name: Build songbook and publish to website
on:
  push:
    branches: [main, master]
  pull_request:

env:
  # The score images are exported with this MuseScore (tools/scores.py). Moving to
  # another version can change the layout of the scores; review them in the PDF diff.
  MUSESCORE_URL: https://github.com/musescore/MuseScore/releases/download/v4.6.5/MuseScore-Studio-4.6.5.253511702-x86_64.AppImage
  MUSESCORE_DIR: /home/runner/musescore

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about 4 minutes; a hung step must not hold the runner for the
    # default 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every edition (a folder of editions/) is built, checked and released; the one
      # place that says what an edition is lists them, so a new edition needs no change here.
      - name: List editions
        id: editions
        run: echo "names=$(python3 tools/build_edition.py --list | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # Derived .tex files are build outputs, not committed.
      - name: Generate derived files
        run: |
          for edition in ${{ steps.editions.outputs.names }}; do
            python3 tools/generate.py --edition "$edition"
          done

      # Unit tests: the Czech collation (song order), the generator and the lints.
      - name: Unit tests
        run: python3 -m unittest discover -s tools

      # Songs against the artists registry: errors fail, warnings are listed.
      - name: Lint songs and registry
        run: python3 tools/lint.py

      # The converter reads every song; anything it does not accept fails with its line.
      - name: Converter
        run: python3 tools/convert.py

      # MuseScore runs headless under a virtual display (xvfb); it needs some X and
      # OpenGL libraries the runner may lack. rsvg-convert turns the SVGs into PDFs
      # for pdfLaTeX. CMU Serif is the font of the shared score style. Poppler is for
      # the PDF diff of pull requests; one apt call for all of them. The step normally
      # takes about 15 s: the time limit and the retries keep a mirror outage from
      # holding the run for 15 minutes (as on 11 Nov 2026); re-run the job then.
      - name: Install the score export and PDF diff tools
        timeout-minutes: 5
        run: |
          apt="sudo apt-get -o Acquire::Retries=3"
          $apt update
          $apt install -y xvfb librsvg2-bin fonts-cmu poppler-utils \
            libopengl0 libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0

      - name: Cache MuseScore
        id: musescore-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MUSESCORE_DIR }}
          key: musescore-${{ env.MUSESCORE_URL }}

      # The AppImage is unpacked rather than mounted: the runner has no FUSE.
      - name: Download MuseScore
        if: steps.musescore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$MUSESCORE_DIR" && cd "$MUSESCORE_DIR"
          curl -fsSL -o musescore.AppImage "$MUSESCORE_URL"
          chmod +x musescore.AppImage
          ./musescore.AppImage --appimage-extract > /dev/null
          rm musescore.AppImage

      - name: Export scores
        run: |
          echo "MSCORE=$MUSESCORE_DIR/squashfs-root/AppRun" >> "$GITHUB_ENV"
          MSCORE="$MUSESCORE_DIR/squashfs-root/AppRun" xvfb-run -a python3 tools/scores.py

      # The same build as `make`: tools/build_edition.py runs latexmk for every edition
      # into build/editions/<name>/, and fails on a link to a missing target. Pinned to
      # TeX Live 2023 (pdfTeX 1.40.25): a frozen release, and the one the dev workspace
      # uses, so local builds match CI. Moving to another year changes the layout; use
      # the song-by-song diff to review it. The image is Alpine-based and has no Python,
      # hence the apk line; `set -eu` because that shell does not stop on an error by itself.
      - name: Compile LaTeX
        uses: xu-cheng/texlive-action@v2
        with:
          texlive_version: 2023
          run: |
            set -eu
            apk add --no-cache python3
            for edition in ${{ steps.editions.outputs.names }}; do
              python3 tools/build_edition.py --edition "$edition"
            done

      - name: Check one song per page
        run: |
          for edition in ${{ steps.editions.outputs.names }}; do
            python3 tools/check_pages.py --edition "$edition"
          done

      # Chord positions are written by every build (zpevnik.chords next to the PDF).
      # Any overlap in any edition fails.
      - name: Check chord overlaps
        run: |
          for edition in ${{ steps.editions.outputs.names }}; do
            python3 tools/chord_gaps.py --edition "$edition"
          done

      # Overleaf setup: zpevnik.sty and one song, nothing else. The script builds
      # the five test documents (single song, \artist, metadata, chords, spacing)
      # and checks what they print; a failed check fails the job. It needs bash, a
      # GNU grep (-P), poppler (pdfinfo, pdftotext) and python3, which the
      # Alpine-based TeX Live image may lack, hence the apk line.
      - name: Test documents (single song, artist, metadata, chords, spacing)
        uses: xu-cheng/texlive-action@v2
        with:
          texlive_version: 2023
          run: |
            apk add --no-cache bash grep poppler-utils python3
            bash tests/single-song.sh tests/build --build

      # Pull requests only: build the base (the first parent of the merge
      # commit) in the same job with the same TeX Live and report which songs
      # and pages differ, for every edition the base has too (an edition's own
      # pages are only in its PDF). The report never fails the build.
      - name: Check out base for the PDF diff
        id: base
        if: github.event_name == 'pull_request'
        run: |
          base=HEAD^1
          git rev-parse --verify -q HEAD^2 >/dev/null || base="${{ github.event.pull_request.base.sha }}"
          git worktree add base "$base"
          shared=""
          for edition in ${{ steps.editions.outputs.names }}; do
            if [ -f "base/editions/$edition/edition.toml" ]; then shared="$shared $edition"; fi
          done
          echo "editions=$shared" >> "$GITHUB_OUTPUT"

      - name: Generate derived files for base
        if: github.event_name == 'pull_request'
        run: |
          for edition in ${{ steps.base.outputs.editions }}; do
            python3 base/tools/generate.py --edition "$edition" base
          done

      # A base with tools/scores.py exports its scores like the head; an older base
      # has the images committed.
      - name: Export scores for base
        if: github.event_name == 'pull_request'
        run: if [ -f base/tools/scores.py ]; then xvfb-run -a python3 base/tools/scores.py base; fi

      # In the same TeX Live as the head, so the image never shows in the diff.
      - name: Compile base
        if: github.event_name == 'pull_request'
        uses: xu-cheng/texlive-action@v2
        with:
          texlive_version: 2023
          run: |
            set -eu
            apk add --no-cache python3
            cd base
            for edition in ${{ steps.base.outputs.editions }}; do
              python3 tools/build_edition.py --edition "$edition"
            done

      # An edition the base does not have is new: nothing to compare it with. A diff
      # that cannot run is named in the summary, and the other editions are still compared.
      - name: Song-by-song PDF diff
        if: github.event_name == 'pull_request'
        run: |
          for edition in ${{ steps.editions.outputs.names }}; do
            case " ${{ steps.base.outputs.editions }} " in
              *" $edition "*) python3 tools/pdfdiff.py --base base --head . --edition "$edition" \
                                || printf '## Song-by-song PDF diff: %s\n\nFAILED: see the log.\n\n' "$edition" ;;
              *) printf '## Song-by-song PDF diff: %s\n\nA new edition: the base has nothing to compare it with.\n\n' "$edition" ;;
            esac
          done | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 tools/generate.py --version)

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::Computed version '$version' looks invalid, aborting."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag is never overwritten or moved. It exists already only if songs were
      # removed and the song count returned to an earlier value. Checked before
      # anything is published.
      - name: Fail if the release tag exists
        if: github.event_name == 'push'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; the release is not overwritten."
            exit 1
          fi

      - name: List newly added songs
        id: new_songs
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            added=""
          else
            # With rename detection: a renamed song is not new.
            added=$(git diff -M --name-status "$base" "${{ github.sha }}" -- songs/ \
                    | awk '$1=="A" {print $2}')
          fi

          {
            echo "block<<SONGSEOF"
            if [ -n "$added" ]; then
              echo ""
              printf '%s\n' "$added" | while IFS= read -r f; do
                [ -z "$f" ] && continue
                title=$(grep -oP '(?<=\\song\{)[^}]*' "$f" | head -n1)
                echo "- ${title:-$(basename "$f" .tex)}"
              done
            fi
            echo "SONGSEOF"
          } >> "$GITHUB_OUTPUT"

      # One PDF per edition under its asset name (zpevnik-<edition>-<version>.pdf) and the
      # editions part of the release notes. Pull requests run it too, so a missing PDF or
      # a broken edition shows before the merge; only the release below is push-only.
      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          notes=$(python3 tools/release.py "${{ steps.version.outputs.version }}")
          echo "$notes"
          { echo "editions<<EDITIONSEOF"; echo "$notes"; echo "EDITIONSEOF"; } >> "$GITHUB_OUTPUT"

      # The website holds no PDFs (E6, D-150): its build downloads them from the release
      # named in version.txt. So the release is created first and the version is pushed
      # after it, and the website never points at a release that does not exist yet.
      - name: Checkout website repo
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: f-hluchnik/zpevnik-web
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Write version file
        if: github.event_name == 'push'
        run: echo "${{ steps.version.outputs.version }}" > website/version.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v${{ steps.version.outputs.version }}
            name: Zpěvník v${{ steps.version.outputs.version }}
            body: |
                ${{ steps.new_songs.outputs.block }}

                ${{ steps.assets.outputs.editions }}
            files: build/release/*.pdf
            make_latest: true

      - name: Commit and push
        if: github.event_name == 'push'
        working-directory: website
        run: |
          git config user.name "songbook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add version.txt
          git commit -m "Update songbook to v${{ steps.version.outputs.version }}" || echo "nothing to commit"
          git push