# What the printer asked for (D-188): letters at least 12 mm from the spine and 4 mm from the
# outer edge, with half a millimetre to spare for the cut; crop marks, no bleed. The book block
# starts after the edition's cover and its back (2 pages): the cover is printed separately.
[print]
spine_margin_mm = 12.5
outer_margin_mm = 4.5
skip_first_pages = 2
crop_marks = true
