# Artists and collections of the songbook (D-002, D-114).
#
# One [[entry]] per section of the artist index. Song files refer to an entry
# by its slug only. Write only what differs from the default.
#
#   slug        (required) anchor used by \artist: lowercase ASCII name, no spaces,
#               no leading article
#   name        (required) heading of the section and name in the artist index;
#               people as "Surname, First". A line break (\n) is a forced line
#               break in the heading (a long heading does not wrap by itself)
#   label       how the artist is named in the index and, unless link_label is
#               set, in the link on the artist's songs.
#               Default: "First Surname" for a name of the form "Surname, First",
#               otherwise the name itself
#   link_label  shorter text for the link on the artist's songs. Default: label
#   sort        collation key (D-107). Default: name. Collections come after all
#               artists, ordered by their own key
#   kind        "artist" (default), or "collection" (songs grouped by theme, not by author)
#   section     true (default) if the book has a section for this entry
#
# The text is plain: no TeX markup (the generator escapes it).

